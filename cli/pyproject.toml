[build-system]
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "personal-ai-agent"
version         = "1.0.0"
description     = "Personal AI Agent CLI — offline voice assistant with memory"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }
authors         = [{ name = "You" }]
keywords        = ["ai", "voice", "assistant", "offline", "whisper", "ollama"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "openai-whisper",
    "sounddevice",
    "soundfile",
    "numpy",
    "webrtcvad",
    "lingua-language-detector",
    "ollama",
    "chromadb",
    "sentence-transformers",
]

[project.scripts]
flux = "flux:main"

[project.urls]
Homepage = "https://github.com/yourusername/personal-ai-agent"

[tool.setuptools]
py-modules = ["flux"]